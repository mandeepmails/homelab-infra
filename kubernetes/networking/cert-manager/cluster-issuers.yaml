apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sample-lan-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sample-lan-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: sample.lan Root CA
  secretName: sample-lan-root-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: sample-lan-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sample-lan-ca
spec:
  ca:
    secretName: sample-lan-root-ca
