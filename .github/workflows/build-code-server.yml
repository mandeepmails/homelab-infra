name: Build code-server

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/apps/code-server/image/**
      - kubernetes/apps/code-server/deployment.yaml
      - .github/workflows/build-code-server.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kubernetes/apps/code-server/image
          push: true
          tags: |
            ghcr.io/mandeepmails/homelab-code-server:stage1
            ghcr.io/mandeepmails/homelab-code-server:${{ github.sha }}
