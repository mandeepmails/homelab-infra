name: Build Code Server

on:
  push:
    branches:
      - main
    paths:
      - docker/code-server/**
      - .github/workflows/build-code-server.yml

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/code-server
          push: true
          tags: |
            ghcr.io/mandeepmails/homelab-code-server:latest
            ghcr.io/mandeepmails/homelab-code-server:${{ github.sha }}
